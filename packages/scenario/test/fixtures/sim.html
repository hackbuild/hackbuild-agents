<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>scenario fixture</title></head>
<body>
<canvas id="c" width="200" height="200"></canvas>
<script type="module">
// A small seeded sim with the lockstep test API: an agent walks to random
// waypoints at a fixed step. Loads three from the CDN, which the runner
// routes to node_modules. With &leak=1 it requests an unrouted URL.
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js";
const q = new URLSearchParams(location.hash.slice(1).replace(/^test&?/, ""));
const test = location.hash.startsWith("#test");
let seed = Number(q.get("seed") ?? 1) >>> 0;
const rng = () => { seed = (seed + 0x6d2b79f5) >>> 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed) >>> 0; t = ((t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t) >>> 0; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const a = { pos: new THREE.Vector2(0, 0), yaw: 0, v: 0, goal: null, state: "idle" };
let step = 0;
const rows = [];
let h = 2166136261;
const dt = 1 / 60;
function tick() {
  if (!a.goal || a.pos.distanceTo(a.goal) < 0.2) { a.goal = new THREE.Vector2(rng() * 8 - 4, rng() * 8 - 4); a.state = a.state === "walk" ? "look" : "walk"; }
  const to = a.goal.clone().sub(a.pos);
  const want = Math.atan2(to.x, to.y);
  let d = want - a.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
  a.yaw += THREE.MathUtils.clamp(d, -3 * dt, 3 * dt);
  a.v += (1.2 - a.v) * 0.1;
  a.pos.x += Math.sin(a.yaw) * a.v * dt; a.pos.y += Math.cos(a.yaw) * a.v * dt;
  step++;
  for (const x of [a.pos.x, a.pos.y, a.yaw]) { h ^= Math.round(x * 1e6) | 0; h = Math.imul(h, 16777619) >>> 0; }
  if (step % 15 === 0) rows.push([step, +a.pos.x.toFixed(4), +a.pos.y.toFixed(4), +a.yaw.toFixed(4), a.state]);
}
const ctx = document.getElementById("c").getContext("2d");
function render() { ctx.fillStyle = "#eee"; ctx.fillRect(0, 0, 200, 200); ctx.fillStyle = "#222"; ctx.fillRect(100 + a.pos.x * 20 - 3, 100 - a.pos.y * 20 - 3, 6, 6); }
window.__sim = { step(n) { for (let i = 0; i < n; i++) tick(); }, trace() { return { cols: ["step", "x", "z", "yaw", "state"], rows, hash: h.toString(16) }; }, render, agent: a };
window.__rafSample = () => [a.pos.x, a.pos.y, a.yaw];
if (q.get("leak") === "1") fetch("https://example.invalid/track").catch(() => {});
if (!test) { const loop = () => { tick(); render(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
